# Stack lokal ielts-learning-platform (SPEC-000). Jalankan dari root repo:
#   docker compose -f codes/docker-compose.yml up -d db
# Rahasia dibaca dari codes/.env (lihat .env.example). Tidak ada rahasia di berkas ini.
name: ielts

x-app-hardening: &app-hardening
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 256
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-app-env: &app-env
  NODE_ENV: ${NODE_ENV:-production}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Jakarta}
  DATABASE_URL: postgres://app_rw:${APP_RW_PASSWORD:?isi APP_RW_PASSWORD di .env}@db:5432/${POSTGRES_DB:-ielts}
  IP_HMAC_SECRET: ${IP_HMAC_SECRET:?isi IP_HMAC_SECRET di .env}
  ASSETS_DIR: ${ASSETS_DIR:-/data/assets}
  STORAGE_DRIVER: ${STORAGE_DRIVER:-fs}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_REGION: ${S3_REGION:-}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-}
  AI_ENABLED: ${AI_ENABLED:-false}
  LLM_DRIVER: ${LLM_DRIVER:-ollama}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
  OLLAMA_MODEL_WRITING: ${OLLAMA_MODEL_WRITING:-}
  OLLAMA_MODEL_SPEAKING: ${OLLAMA_MODEL_SPEAKING:-}
  OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
  STT_DRIVER: ${STT_DRIVER:-whisper}
  STT_BASE_URL: ${STT_BASE_URL:-http://stt:8080}
  AI_JOB_TIMEOUT_SEC: ${AI_JOB_TIMEOUT_SEC:-180}
  AI_NUM_PREDICT: ${AI_NUM_PREDICT:-1500}
  # AUTH_*, ALLOWED_HOSTS, UPLOAD_MAX_* ditambahkan khusus di servis web.

services:
  db:
    image: postgres:16.10-alpine
    restart: unless-stopped
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "max_connections=50"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ielts}
      POSTGRES_USER: ${POSTGRES_USER:-postgres_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di .env}
      APP_RW_PASSWORD: ${APP_RW_PASSWORD:?isi APP_RW_PASSWORD di .env}
      APP_MIGRATOR_PASSWORD: ${APP_MIGRATOR_PASSWORD:?isi APP_MIGRATOR_PASSWORD di .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    networks: [app-net]
    mem_limit: 1536m
    pids_limit: 256
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    <<: *app-hardening
    build: { context: ., dockerfile: Dockerfile, target: migrate }
    image: ielts-migrate:local
    restart: "no"
    user: "1000:1000"
    environment:
      NODE_ENV: production
      DATABASE_MIGRATOR_URL: postgres://app_migrator:${APP_MIGRATOR_PASSWORD:?isi APP_MIGRATOR_PASSWORD di .env}@db:5432/${POSTGRES_DB:-ielts}
      AI_JOB_TIMEOUT_SEC: ${AI_JOB_TIMEOUT_SEC:-180}
      SIGNUP_MODE: ${SIGNUP_MODE:-invite}
      AI_DAILY_LIMIT_PER_USER: ${AI_DAILY_LIMIT_PER_USER:-10}
      AUDIO_RETENTION_DAYS: ${AUDIO_RETENTION_DAYS:-90}
      MIGRATE_BACKUP_DIR: /backups/pre-migrate
    volumes:
      # Backup pra-migrasi (pg_dump) bila tabel users berisi baris.
      - ${BACKUP_DIR:?isi BACKUP_DIR di .env (di luar repo)}:/backups
    depends_on:
      db: { condition: service_healthy }
    networks: [app-net]

  web:
    <<: *app-hardening
    build: { context: ., dockerfile: Dockerfile, target: web }
    image: ielts-web:local
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache:uid=1000,gid=1000
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      <<: *app-env
      AUTH_SECRET: ${AUTH_SECRET:?isi AUTH_SECRET di .env}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-false}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost:3000,127.0.0.1:3000}
      UPLOAD_MAX_MB_RECORDING: ${UPLOAD_MAX_MB_RECORDING:-10}
      UPLOAD_MAX_MB_AUDIO_ASSET: ${UPLOAD_MAX_MB_AUDIO_ASSET:-50}
      UPLOAD_MAX_MB_IMAGE: ${UPLOAD_MAX_MB_IMAGE:-5}
      UPLOAD_MAX_MB_DOCUMENT: ${UPLOAD_MAX_MB_DOCUMENT:-25}
      UPLOAD_MAX_MB_IMPORT: ${UPLOAD_MAX_MB_IMPORT:-5}
    volumes:
      - assets:/data/assets
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    networks: [app-net, edge-net]
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    <<: *app-hardening
    build: { context: ., dockerfile: Dockerfile, target: worker }
    image: ielts-worker:local
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:uid=1000,gid=1000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *app-env
      AUTH_SECRET: ${AUTH_SECRET:?isi AUTH_SECRET di .env}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost:3000,127.0.0.1:3000}
    volumes:
      - assets:/data/assets
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    networks: [app-net, edge-net]
    mem_limit: 768m
    stop_grace_period: 40s
    healthcheck:
      test: ["CMD", "node", "dist/healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  stt:
    <<: *app-hardening
    profiles: [ai]
    build: { context: ./docker/stt, dockerfile: Dockerfile }
    image: ielts-stt:local
    restart: unless-stopped
    user: "1000:1000"
    environment:
      STT_MODEL: ${STT_MODEL:-base}
    volumes:
      - whisper_models:/models
    networks: [app-net]
    mem_limit: 1536m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  ollama:
    profiles: [ollama-container]
    image: ollama/ollama:0.12.11
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    networks: [app-net]
    pids_limit: 512
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5

  minio:
    profiles: [minio]
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-}
    volumes:
      - minio_data:/data
    networks: [app-net]
    mem_limit: 512m
    pids_limit: 256
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 5s
      retries: 5

  proxy:
    profiles: [proxy]
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    environment:
      PROXY_SITE: ${PROXY_SITE:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      web: { condition: service_healthy }
    networks: [edge-net]
    mem_limit: 128m
    pids_limit: 256
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2019/config/ >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5

  backup:
    <<: *app-hardening
    image: postgres:16.10-alpine
    restart: unless-stopped
    # Uid 70 = pengguna `postgres` di image alpine; scheduler berupa loop sh (tanpa crond/root).
    user: "70:70"
    entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh", "loop"]
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-ielts}
      PGUSER: app_migrator
      PGPASSWORD: ${APP_MIGRATOR_PASSWORD:?isi APP_MIGRATOR_PASSWORD di .env}
      BACKUP_TZ: ${BACKUP_TZ:-WIB-7}
    volumes:
      - ${BACKUP_DIR:?isi BACKUP_DIR di .env (di luar repo)}:/backups
      - assets:/data/assets:ro
      - ./docker/backup/backup.sh:/usr/local/bin/backup.sh:ro
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    networks: [app-net]
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "find /backups/.last_ok -mmin -1560 | grep -q ."]
      interval: 1h
      timeout: 5s
      retries: 1
      start_period: 10m

networks:
  # Jaringan internal tanpa rute keluar; db/stt/ollama/minio/backup hanya di sini.
  app-net:
    driver: bridge
    internal: true
  edge-net:
    driver: bridge

volumes:
  pgdata:
  assets:
  whisper_models:
  ollama_models:
  minio_data:
  caddy_data:
  caddy_config:
