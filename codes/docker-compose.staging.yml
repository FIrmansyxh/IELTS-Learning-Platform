# Stack staging di mesin yang sama: project name, port, DB, dan volume terpisah.
#   docker compose -p ielts-stg -f codes/docker-compose.yml -f codes/docker-compose.staging.yml --env-file codes/.env.staging up -d
# Gunakan file env terpisah (BACKUP_DIR, password, AUTH_URL=http://localhost:3100). Memerlukan Docker Compose >= 2.24 (`!override`).
services:
  web:
    ports: !override
      - "127.0.0.1:3100:3000"
  proxy:
    ports: !override
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8443:443"
