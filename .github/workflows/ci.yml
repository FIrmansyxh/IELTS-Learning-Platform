name: Product CI

on:
  push:
    branches: [main, development]
    paths: ['codes/**', '.github/workflows/ci.yml', 'content/**']
  pull_request:
    branches: [main, development]
    paths: ['codes/**', '.github/workflows/ci.yml', 'content/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  LLM_DRIVER: mock
  STT_DRIVER: mock
  AI_ENABLED: 'true'
  NODE_VERSION: 22.20.0

defaults:
  run:
    working-directory: codes

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: codes/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: codes/package-lock.json
      - run: npm ci
      # Coverage gabungan unit + integrasi (SQLite sementara, tanpa layanan eksternal); ambang lines >= 70%
      # ada di vitest.coverage.config.ts (gagal bila kurang). Tidak ada coverage.exclude.
      - run: npm run coverage

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: codes/package-lock.json
      - run: npm ci
      # Berkas SQLite sementara + migrasi + seed disiapkan oleh tests/integration/global-setup.ts.
      - run: npm run test:integration

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: codes/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NODE_ENV: production

  e2e:
    # ubuntu-24.04 (bukan ubuntu-latest): Playwright belum mendukung Ubuntu 26.04 yang kini menjadi ubuntu-latest.
    runs-on: ubuntu-24.04
    needs: build
    env:
      CI: 'true'
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: codes/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Runner mandiri: DB SQLite sementara, migrasi + seed, impor konten bawaan, server dev, lalu Playwright.
      # Hanya spec yang sudah terbukti hijau (home, learner-journey, mix-builder, tracks, simulation).
      # Spec core-*, exam-*, platform-* masih menunggu run valid (lihat task/e2e-test-feature) dan belum dijalankan di CI.
      - name: Playwright (desktop + mobile)
        run: node tests/e2e/helpers/run-e2e.mjs --reporter=list "(home|learner-journey|mix-builder|tracks|simulation)"
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: playwright-report
          path: codes/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # SPEC-025 Fase 4 (P4-13/21/24/40): runner bersih menjalankan alur satu perintah tanpa LLM.
  start-local-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AI_ENABLED: 'false'
      PORT_SMOKE: '3015'
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: codes/package-lock.json
      - run: npm ci
      - name: start:local, kesiapan, impor konten, doctor, SIGINT bersih
        shell: bash
        run: |
          set -euo pipefail
          unset HOSTNAME
          base="http://127.0.0.1:${PORT_SMOKE}"
          node scripts/start-local.mjs --no-open --port "$PORT_SMOKE" > /tmp/start-local.log 2>&1 &
          pid=$!
          ready=0
          for i in $(seq 1 450); do
            if curl -fsS "$base/api/health" > /dev/null 2>&1; then ready=1; break; fi
            if ! kill -0 "$pid" 2> /dev/null; then break; fi
            sleep 2
          done
          # start-local mencetak "Aplikasi siap" setelah pemeriksaan kesiapannya sendiri; beri waktu agar log tidak balapan dengan curl di atas.
          for i in $(seq 1 30); do
            if grep -qF "Aplikasi siap: $base" /tmp/start-local.log; then break; fi
            sleep 1
          done
          cat /tmp/start-local.log
          test "$ready" = 1
          grep -F "Aplikasi siap: $base" /tmp/start-local.log
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/pilih-profil")" = 200
          # Host asing ditolak (P4-20)
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example' "$base/api/v1/profiles")" = 403
          # Konten bawaan terbit (P4-13)
          node -e "const {DatabaseSync}=require('node:sqlite');const n=new DatabaseSync('data/ielts.db',{readOnly:true}).prepare(\"SELECT count(*) AS n FROM sub_modules WHERE status='PUBLISHED'\").get().n;console.log('PUBLISHED',n);process.exit(n>=1?0:1)"
          # doctor hijau (P4-40)
          npm run doctor
          # SIGINT bersih (P4-24)
          kill -INT "$pid"
          code=0
          wait "$pid" || code=$?
          echo "exit start-local: $code"
          test "$code" = 0
          if curl -fsS "$base/api/health" > /dev/null 2>&1; then echo "port masih aktif"; exit 1; fi

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: codes/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high --omit=dev
      - uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Organisasi (bukan akun pribadi) memerlukan GITLEAKS_LICENSE sebagai GitHub Secret.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
